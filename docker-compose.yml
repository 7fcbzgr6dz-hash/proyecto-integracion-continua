# Compose crea una red privada y registra cada servicio en su DNS interno.
services:
  web:
    # Construye la imagen de Flask desde el Dockerfile de este proyecto.
    build: .
    container_name: web
    ports:
      - "5000:5000"
    depends_on:
      # Espera a que MySQL responda antes de iniciar la aplicación web.
      db:
        condition: service_healthy

  db:
    # MySQL 8 se descubre desde web usando el nombre DNS "db".
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: universidad
    ports:
      - "3306:3306"
    volumes:
      # Conserva los datos de MySQL aunque se recreen los contenedores.
      - mysql_data:/var/lib/mysql
    healthcheck:
      # La contraseña se expande dentro del contenedor, no en el host.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

# Volumen administrado por Docker para persistir la base de datos.
volumes:
  mysql_data: